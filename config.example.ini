; Copy this file to config.ini. Keep your local config.ini out of Git.
[viewer]
; This controls editing/generation, not authentication. See docs/configuration.md.
; true: view prepared CSVs only; block panel, snapshot and CMS changes.
; false: allow editing and live graph generation behind your existing login.
read_only = true
; Homepage table timestamps and fresh/stale colours, including interpretation of
; timestamps without a timezone. Match the timezone used by your collected data.
display_timezone = "America/New_York"
; Maximum live graph generators across all users/tabs of this installation.
; Other graph requests wait before starting Python. Set an integer from 1 to 32.
max_graph_generators = 4

[waveforms]
; Full HTTP(S) URL of the separate waveform viewer, e.g. https://example.org/waveforms.
; Leave empty to hide all waveform links.
url = ""
; Database table the waveform viewer searches to locate original ROOT files.
index_table = "root_files"

; Optional homepage sections, displayed after the panels in the order they're written in this file.
; Give each section a unique name beginning with homepage_link. and uncomment it.
; Title, label and description are plain text; description is optional.
; URLs may be local relative paths or full HTTP(S) URLs. An empty URL hides the section.
; [homepage_link.reports]
; title = "Experiment reports"
; label = "Open reports"
; url = "reports/"
; description = "Reports and supporting documents for this installation."

; [homepage_link.documentation]
; title = "Documentation"
; label = "Read the documentation"
; url = "https://example.org/documentation"
